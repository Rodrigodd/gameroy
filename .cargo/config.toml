[env]
# workaround for https://github.com/rust-lang/cargo/issues/3946
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
# Increase default stack size to avoid running out of stack space in debug
# builds. The size matches Linux's default.
rustflags = ["-C", "link-arg=/STACK:8000000"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]

[registries.crates-io]
protocol = "sparse"
