[workspace]
# The giui-based frontend (the old root `gameroy` package, plus its `native`,
# `wasm` and `android` launchers) and `libretro` are temporarily out of the build:
#   - giui's `LoadStyle` derive uses `_serde::__private`, removed in serde >= 1.0.229
#   - libretro/src/lib.rs:194 uses `retro_game_info.data/.size`, gone from rust-libretro-sys
# Their sources are untouched on disk. To restore this manifest:
#   git show master:Cargo.toml > Cargo.toml
members = ["core", "jit"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Rodrigo Batista de Moraes <rodrigobatsmoraes@hotmail.com>"]
repository = "https://github.com/Rodrigodd/gameroy"
license = "MIT OR Apache-2.0"

[patch.crates-io]

# NOTE: the patches below are commented out only because nothing in the current
# workspace depends on these crates, which makes cargo warn on every build.
# Re-enable each one as its dependent returns (cpal with audio-engine, rfd with
# the file dialogs).

# waiting for https://github.com/sebcrozet/instant/pull/46
# instant = { git = "https://github.com/Rodrigodd/instant.git" }

# contains hacky workaround for https://github.com/rust-windowing/winit/issues/2299
# and this volume buttons fix: https://github.com/rust-windowing/winit/pull/1919
# winit = { git = "https://github.com/Rodrigodd/winit.git", branch = "v0.27.5-gameroy" }

# fork contains a android backend
# rfd = { git = "https://github.com/Rodrigodd/rfd.git", branch = "android", optional = true }

# hard code oboe's performance mode to low latency
# cpal = { git = "https://github.com/Rodrigodd/cpal.git", branch = "oboe-low-latency" }

# contains this fix: https://github.com/Nercury/android_logger-rs/pull/62
# Disabled: the fork's revision 032b026 is no longer reachable on GitHub, which
# breaks dependency resolution for the whole workspace.
# android_logger = { git = "https://github.com/TiggeZaki/android_logger-rs", branch = "patch-1" }


[profile.dev]
opt-level = 1
# [profile.dev.package.audio-engine]
# opt-level = 3

# Make image decoding be about 10x faster.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

[profile.release]
debug = true

[profile.test]
opt-level = 3
# overflow-checks = false

[profile.fast]
inherits = "release"
debug = false
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.debugging]
inherits = "dev"
opt-level = 0
