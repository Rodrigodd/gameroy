[package]
name = "gameroy-server"
description = "Emulation server for GameRoy: runs the Game Boy, speaks a message protocol, renders nothing."
version.workspace = true
edition = "2024"
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["emulation", "thread-driver", "jit"]
# The emulator itself. Without this, only the `protocol` module is compiled, so a
# front-end talking to a remote server does not link the emulator at all.
emulation = ["dep:gameroy-core"]
# In-process channel transport.
transport-channel = ["dep:flume"]
# The blocking std::thread run loop. Not usable on wasm.
thread-driver = ["emulation", "transport-channel"]
# The x86_64 recompiler. Has no effect on other architectures, where the
# optional dependency simply does not exist and the interpreter is used.
jit = ["emulation", "dep:gameroy-jit"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
log = "0.4"
gameroy-core = { path = "../core", optional = true }
flume = { version = "0.11", default-features = false, optional = true }

# x86_64 only: it emits native machine code, so it cannot work under wasm.
[target.'cfg(target_arch = "x86_64")'.dependencies]
gameroy-jit = { path = "../jit", optional = true }

[dev-dependencies]
serde_json = "1"
