[package]
name = "gameroy-slint"
description = "A Slint frontend for the GameRoy Game Boy emulator."
version.workspace = true
# The workspace defaults to edition 2021 for the older crates; this is new code.
edition = "2024"
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
gameroy-core = { path = "../core" }
slint = "1.18.0"

[build-dependencies]
slint-build = "1.18.0"
