[package]
name = "gameroy-slint"
description = "A Slint frontend for the GameRoy Game Boy emulator."
version.workspace = true
# The workspace defaults to edition 2021 for the older crates; this is new code.
edition = "2024"
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Note: no dependency on gameroy-core. The front-end talks to the server only
# through the protocol; if this list ever grows a `gameroy-core`, the client/server
# boundary has rotted.
gameroy-server = { path = "../gameroy-server" }
# `unstable-winit-030` is the only way to receive an OS file drop: Slint 1.18 has a
# `DropArea` element, but only the Qt backend ever feeds it, and there is no public
# API to inject a drop event. See the hook in main.rs.
slint = { version = "1.18.0", features = ["unstable-winit-030"] }
log = "0.4"
env_logger = "0.11"
audio-engine = "0.4.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rfd = "0.15"
# Box art: decode whatever libretro serves, resize it, re-encode as the cache PNG.
image = { version = "0.25.4", default-features = false, features = ["png", "jpeg"] }
# Default features, unlike the old front-end's: the thumbnail URL is https now.
ureq = "2.12"

[build-dependencies]
slint-build = "1.18.0"
